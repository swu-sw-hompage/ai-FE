name: Deploy AI Homepage to AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: swu-ai-homepage-production
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::560450143549:role/GitHubActionsSwuAiHomepageDeploy
          aws-region: ap-southeast-2

      - name: Deploy main to the AI homepage server
        env:
          INSTANCE_ID: i-016be48f50d09e369
        shell: bash
        run: |
          deploy_script=$(cat <<'SCRIPT'
          set -euo pipefail
          cd /opt/swu-ai-fe
          git fetch --depth=1 origin main
          git reset --hard origin/main
          export VITE_USE_MOCK=false
          export VITE_API_BASE_URL=/api
          npm-22 ci --no-audit --no-fund
          npm-22 run build
          install -d -m 0755 /usr/share/nginx/html
          find /usr/share/nginx/html -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          cp -a dist/. /usr/share/nginx/html/
          nginx -t
          systemctl reload nginx
          curl -fsS --max-time 15 http://127.0.0.1/ >/dev/null
          SCRIPT
          )

          parameters=$(jq -nc --arg command "$deploy_script" '{commands: [$command]}')
          command_id=$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "$INSTANCE_ID" \
            --comment "Deploy ai-FE main ${GITHUB_SHA}" \
            --parameters "$parameters" \
            --query 'Command.CommandId' \
            --output text)

          for attempt in $(seq 1 120); do
            status=$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" \
              --query Status \
              --output text 2>/dev/null || true)
            case "$status" in
              Success) exit 0 ;;
              Failed|Cancelled|TimedOut|DeliveryTimedOut|Undeliverable|Cancelling)
                aws ssm get-command-invocation \
                  --command-id "$command_id" \
                  --instance-id "$INSTANCE_ID" \
                  --query '{status:Status,stdout:StandardOutputContent,stderr:StandardErrorContent}' \
                  --output json
                exit 1
                ;;
            esac
            sleep 5
          done

          echo "SSM deployment did not finish within 10 minutes"
          exit 1
